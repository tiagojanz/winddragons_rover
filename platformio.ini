[platformio]
default_envs = rover_lafvin, rover_c6, base

[common]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-c6-devkitm-1
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 921600
monitor_dtr = 0
monitor_rts = 0
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I include
extra_scripts = pre:scripts/pio_custom_targets.py

[env:rover_lafvin]
extends = common
build_src_filter = 
    +<rover/main_rover_lafvin.cpp>
    +<Display_ST7789.cpp>
build_flags = 
    ${common.build_flags}
    -DBUILD_ROVER_LAFVIN=1
lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit NeoPixel @ ^1.12.0
    moononournation/GFX Library for Arduino @ ^1.4.6
    mikalhart/TinyGPSPlus @ ^1.0.3
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
    adafruit/Adafruit ADS1X15 @ ^2.5.0

[env:rover_c6]
extends = common
build_src_filter = 
    +<rover/main_rover_c6.cpp>
build_flags = 
    ${common.build_flags}
    -DBUILD_ROVER_C6=1
lib_deps = 
    jgromes/RadioLib @ ^6.6.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    adafruit/Adafruit NeoPixel @ ^1.12.0
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
    adafruit/Adafruit ADS1X15 @ ^2.5.0

[env:base]
extends = common
build_src_filter = 
    +<base/*>
    +<Display_ST7789.cpp>
    -<rover/*>
build_flags = 
    ${common.build_flags}
    -DBUILD_BASE=1
lib_deps = 
    jgromes/RadioLib @ ^6.6.0
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit NeoPixel @ ^1.12.0
    moononournation/GFX Library for Arduino @ ^1.4.6

[env:test_lora]
extends = common
build_src_filter = 
    +<test_lora/*>
    -<rover/*>
    -<base/*>
    -<Display_ST7789.cpp>
lib_deps = 
    jgromes/RadioLib @ ^6.6.0

[env:test_power]
extends = common
build_src_filter = 
    +<test_power/*>
    -<rover/*>
    -<base/*>
    -<test_lora/*>
    -<Display_ST7789.cpp>

[env:test_uart]
extends = common
build_src_filter = 
    +<test_uart/*>
    +<Display_ST7789.cpp>
    -<rover/*>
    -<base/*>
    -<test_lora/*>
    -<test_power/*>
lib_deps = 
    jgromes/RadioLib @ ^6.6.0
    moononournation/GFX Library for Arduino @ ^1.4.6


